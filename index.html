<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover : sans lui, env(safe-area-inset-*) vaut toujours 0. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Une seule déclaration, mise à jour par le script ci-dessous puis par
         React : « système » est résolu en clair ou en sombre avant la première
         peinture, la couleur de la barre du navigateur suit la même valeur. -->
    <meta name="theme-color" content="#F2EDDD" />
    <meta name="referrer" content="no-referrer" />
    <!--
      Le titre et la description sont ceux de la page d'accueil, servie à la
      racine : c'est ce document que voit un moteur de recherche ou un aperçu
      de lien, avant que le moindre script ne tourne. React les remplace par
      ceux de l'application quand le chemin est « /app ».
    -->
    <meta
      name="description"
      content="Un motif, une palette, une densité. Aplat calcule ton fond d’écran dans ton navigateur et te le rend à la résolution exacte de ton écran. Sans compte, sans réseau."
    />

    <!--
      L'aperçu des liens partagés. Le titre et la description sont ceux du
      document, à la lettre : un aperçu qui promet autre chose que la page
      est un mensonge, même petit.

      Pas d'`og:image`. Elle se donne en adresse absolue, et le domaine n'est
      pas connu au build ; une adresse fausse vaut moins qu'une absence, qui
      laisse les plateformes retomber sur l'icône du site. Le jour où le
      domaine sera écrit quelque part, la vignette se dessinera avec le moteur,
      comme le reste.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aplat" />
    <meta property="og:title" content="Aplat : fonds d’écran génératifs" />
    <meta
      property="og:description"
      content="Un motif, une palette, une densité. Aplat calcule ton fond d’écran dans ton navigateur et te le rend à la résolution exacte de ton écran. Sans compte, sans réseau."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Aplat" />

    <!--
      Les deux polices sont auto-hébergées et chargées par la feuille de style,
      qui n'arrive qu'après le JavaScript. Sans préchargement, le titre (le
      seul endroit où la display se voit) apparaît en Impact puis saute.
      `crossorigin` est obligatoire même en même origine pour les polices,
      faute de quoi le navigateur télécharge deux fois.
    -->
    <link
      rel="preload"
      href="/polices/anton-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/polices/archivo-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>Aplat : fonds d’écran génératifs</title>

    <!--
      Le thème et la langue, avant la première peinture.

      Ils vivent sur l'appareil (aplat:theme, aplat:langue, voir
      src/lib/affichage.ts) et se lisent ici en synchrone. React les repose
      lui-même une fois chargé. D'ici là, le document serait peint en clair :
      sur un appareil en thème sombre, un éclair blanc à chaque ouverture, le
      seul défaut d'affichage qu'on ne peut pas corriger après coup puisqu'il
      a déjà eu lieu.

      L'adresse passe d'abord : les liens d'avant portaient `?l=` et `?t=`,
      et ils doivent encore ouvrir la page qu'ils promettaient. L'application
      la nettoie ensuite.

      « Système » est résolu ici, et non par une requête de média dans la
      feuille de style : `data-theme` ne porte ainsi que « clair » ou
      « sombre », et le thème sombre n'est déclaré qu'une fois.
    -->
    <script>
      ;(function () {
        try {
          var q = new URLSearchParams(location.search)
          var choix = q.get('t')
          if (choix !== 'clair' && choix !== 'sombre') {
            try {
              choix = localStorage.getItem('aplat:theme')
            } catch (refus) {
              choix = null
            }
          }
          if (choix !== 'clair' && choix !== 'sombre') {
            choix = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'sombre'
              : 'clair'
          }
          document.documentElement.dataset.theme = choix
          var couleur = document.querySelector('meta[name="theme-color"]')
          if (couleur) couleur.setAttribute('content', choix === 'sombre' ? '#0E1729' : '#F2EDDD')
          var langue = q.get('l')
          if (langue !== 'fr' && langue !== 'en') {
            try {
              langue = localStorage.getItem('aplat:langue')
            } catch (refus) {
              langue = null
            }
          }
          if (langue !== 'fr' && langue !== 'en') {
            langue =
              (navigator.language || 'fr').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'
          }
          document.documentElement.lang = langue
        } catch (erreur) {
          /* URL illisible : le thème système et le français feront l'affaire. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      La région qui annonce les changements de page.

      Elle est ici, et non dans React, parce qu'une région vivante doit être
      posée dans le document *avant* le texte qu'elle porte : montée et
      remplie dans le même souffle, elle est muette chez plusieurs lecteurs
      d'écran. Celle-ci existe donc dès le premier octet, et ne bouge plus.
      `components/Arrivee.tsx` y écrit le titre de la page arrivée, à chaque
      passage d'un document à l'autre, ce qu'un chargement de document
      annonçait tout seul et qu'il n'annonce plus.
    -->
    <p class="vh" id="annonce" role="status"></p>
    <noscript>
      <p style="margin: 22px 16px; max-width: 46ch; line-height: 1.45">
        Aplat calcule les motifs avec JavaScript, dans ton navigateur. Active
        JavaScript pour l’utiliser. Rien n’est envoyé nulle part.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
